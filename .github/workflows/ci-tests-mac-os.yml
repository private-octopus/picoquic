---
name: "CITestsMacOS"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  citests:
    name: CI-Tests-MacOS
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # We must fetch at least the immediate parents so that if this is
          # a pull request then we can checkout the head.
          submodules: 'recursive'

      - name: Building picoquic
        run: |
          # Pin OpenSSL 3: "openssl" resolves to openssl@4 on recent images
          brew install openssl@3
          export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          export PKG_CONFIG_PATH="${OPENSSL_ROOT_DIR}/lib/pkgconfig"
          "${OPENSSL_ROOT_DIR}/bin/openssl" version
          PTLS_CMAKE_OPTS="-DOPENSSL_ROOT_DIR=${OPENSSL_ROOT_DIR}" ./ci/build_picotls.sh
          cmake -S . -B build -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT_DIR}" -DCMAKE_C_FLAGS="-Wall -Wextra -Werror -Wpedantic"
          cmake --build build 

      - name: Perform Unit Tests
        run: |
            ulimit -c unlimited -S
            cd build
            ./picoquic_ct -S .. -n -r && QUICRESULT=$?
            ./picohttp_ct -S .. -n -r && HTTPRESULT=$?
            if [[ ${QUICRESULT} == 0 ]] && [[ ${HTTPRESULT} == 0 ]]; then exit 0; fi;
            exit 1
