---
name: "BuildLibs"

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build (${{ matrix.link }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        link: [static, shared]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compute version
        run: |
          DATE=$(git show -s --date=format:%Y.%m.%d --format=%cd HEAD)
          SHA=$(git rev-parse --short HEAD)
          echo "VERSION=${DATE}.${SHA}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DPICOQUIC_FETCH_PTLS:BOOL=ON \
            -DBUILD_SHARED_LIBS:BOOL=${{ matrix.link == 'shared' && 'ON' || 'OFF' }} \
            -DBUILD_TESTING:BOOL=OFF \
            -DBUILD_DEMO:BOOL=OFF \
            -DBUILD_PQBENCH:BOOL=OFF \
            -DBUILD_LOGREADER:BOOL=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

      - name: Build
        run: cmake --build build --config Release -j

      - name: Install
        run: cmake --install build

      - name: Package
        run: |
          cd install
          tar -czf ../picoquic-picotls-${{ matrix.link }}-${{ env.VERSION }}.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: picoquic-picotls-${{ matrix.link }}-${{ env.VERSION }}
          path: picoquic-picotls-${{ matrix.link }}-${{ env.VERSION }}.tar.gz
          retention-days: 90

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compute version
        run: |
          DATE=$(git show -s --date=format:%Y.%m.%d --format=%cd HEAD)
          SHA=$(git rev-parse --short HEAD)
          echo "VERSION=${DATE}.${SHA}" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: picoquic-picotls-*-${{ env.VERSION }}
          merge-multiple: true

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          files: dist/*.tar.gz
