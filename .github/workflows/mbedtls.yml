---
name: "MbedTLS-test"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  mbedtls:
    name: MbedTLS-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # We must fetch at least the immediate parents so that if this is
          # a pull request then we can checkout the head.
          submodules: 'recursive'

      - name: Installing MbedTLS
        run: |
             pwd
             cd ..
             git clone --single-branch --branch master https://github.com/Mbed-TLS/mbedtls
             cd mbedtls
             echo "cloned mbedtls, branch=master"
             git submodule init
             git submodule update
             mkdir build
             cd build
             cmake -S .. .
             echo "cmake done"
             make
             echo "compiled MbedTLS"
             pwd
             cd ../../picoquic

      - name: Building picoquic
        run: |
          sudo apt-get update
          sudo apt-get install clangd
          sudo apt-get install -y libssl-dev
          echo $CC
          echo $CXX
          # $CC --version
          ./ci/build_picotls.sh
          cmake -S . -B build "-DWITH_OPENSSL=OFF" "-DWITH_MBEDTLS=ON" "-DENABLE_ASAN=ON" "-DENABLE_UBSAN=ON"
          echo ls  /home/runner/work/picoquic/mbedtls/include
          ls /home/runner/work/picoquic/mbedtls/include
          cmake --build build

      - name: Perform Unit Tests
        run: |
            ulimit -c unlimited -S
            cd build
            make picoquic_ct
            QUICRESULT=0
            ./picoquic_ct -S .. tls_api multipath_basic qmux_loop mbedtls_crypto mbedtls_load_key mbedtls_load_key_fail \
                          mbedtls_retrieve_pubkey mbedtls_sign_verify mbedtls_ecdsa_der mbedtls_ecdsa_verify \
                          cert_verify_bad_cert cert_verify_bad_sni cert_verify_invalid \
                          cert_verify_null cert_verify_null_sni cert_verify_rsa \
                          minicrypto_is_last mbedtls > mbedtls_sanity.txt 2>&1 || QUICRESULT=$?
            cat mbedtls_sanity.txt
            echo "picoquic_ct returns <${QUICRESULT}>"
            if [ "${QUICRESULT}" != "0" ]; then exit 1; fi
            leaked=`grep "SUMMARY: AddressSanitizer:" mbedtls_sanity.txt | cut -d ' ' -f 3`
            if [ ! -z "$leaked" ]; then
                echo "leaked: $leaked > 0"; exit 1;
            else
                echo "No leaks detected in picoquic_ct"
            fi
            exit 0

