---
name: "CITestsFreeBSD"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  citests:
    name: CI-Tests-FreeBSD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # We must fetch at least the immediate parents so that if this is
          # a pull request then we can checkout the head.
          submodules: 'recursive'

      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          prepare: |
            pkg install -y cmake git pkgconf
          run: |
            cmake -S . -B build -DPICOQUIC_FETCH_PTLS:BOOL=ON
            cmake --build build
            cd build
            ./picoquic_ct -S .. -n -r && QUICRESULT=$?
            ./picohttp_ct -S .. -n -r -x http_corrupt && HTTPRESULT=$?
            if [ "${QUICRESULT}" = "0" ] && [ "${HTTPRESULT}" = "0" ]; then exit 0; fi
            exit 1
